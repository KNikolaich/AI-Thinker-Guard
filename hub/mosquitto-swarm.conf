# /etc/mosquitto/conf.d/swarm.conf — брокер роя.
# Хаб подключается локально без шифрования, устройства — снаружи по TLS.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/swarm.passwd
acl_file /etc/mosquitto/swarm.acl

listener 1883 127.0.0.1

listener 8883
certfile /etc/mosquitto/certs/swarm.crt
keyfile /etc/mosquitto/certs/swarm.key
